<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Трилот - Игра за Трима</title>
    <style>
        body { background-color: #1b5e20; color: white; font-family: Arial, sans-serif; margin: 0; overflow: hidden; }
        #game-layout { position: relative; width: 100vw; height: 100vh; }
        .player-zone { position: absolute; padding: 10px; background: rgba(0,0,0,0.4); border-radius: 8px; text-align: center; min-width: 150px; }
        #my-zone { bottom: 20px; left: 50%; transform: translateX(-50%); }
        #left-zone { top: 80px; left: 40px; }
        #right-zone { top: 80px; right: 40px; }
        .cards-container { display: flex; gap: 8px; margin-top: 8px; }
        .card { width: 70px; height: 100px; background: white; color: black; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); user-select: none; }
        .card.red { color: red; }
        .card:hover { transform: translateY(-10px); }
        #table { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; height: 200px; border: 2px dashed rgba(255,255,255,0.5); border-radius: 50%; display: flex; justify-content: center; align-items: center; gap: 15px; }
        #scoreboard { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 5px; text-align: center; z-index: 10; width: 550px; }
        #turn-indicator { color: #ffeb3b; font-weight: bold; margin-top: 5px; }
        #an-indicator { color: #00e676; font-size: 14px; margin-top: 3px; font-weight: bold; }
        #bidding-panel { display: none; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 10px; margin-top: 10px; }
        .bid-btn { padding: 8px 15px; margin: 3px; font-weight: bold; cursor: pointer; background: #fff; border: none; border-radius: 4px; }
        .bid-btn:hover { background: #ffeb3b; }
        
        /* Бутон за Музика */
        #music-control { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.6); border: 1px solid white; color: white; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; z-index: 100; }
        #music-control:hover { background: white; color: black; }
    </style>
</head>
<body>

<!-- Аудио Елементи -->
<audio id="bg-music" src="/sound/background.mp3" loop></audio>

<button id="music-control" onclick="toggleMusic()">🎵 Пусни Музика</button>

<div id="game-layout">
    <div id="scoreboard">
        <div id="scores-text">Свързване със сървъра...</div>
        <div id="game-info">Въведете името си в изскачащия прозорец</div>
        <div id="an-indicator">Вашите анонси: Няма</div>
        <div id="turn-indicator"></div>
        
        <div id="bidding-panel">
            <div>Наддайте по-високо:</div>
            <button class="bid-btn" onclick="sendBid('♦')">♦ Каро</button>
            <button class="bid-btn" onclick="sendBid('♥')">♥ Купа</button>
            <button class="bid-btn" onclick="sendBid('♠')">♠ Пика</button>
            <button class="bid-btn" onclick="sendBid('БЕЗ_КОЗ')">Без Коз</button>
            <button class="bid-btn" onclick="sendBid('ВСИЧКО_КОЗ')">Всичко Коз</button>
            <button class="bid-btn" style="background:#ff5252; color:white;" onclick="sendBid('ПАС')">ПАС</button>
        </div>
    </div>

    <div id="table"></div>

    <div id="left-zone" class="player-zone"><div id="left-name">Ляв Опонент</div><div id="left-count">Карти: 0</div></div>
    <div id="right-zone" class="player-zone"><div id="right-name">Десен Опонент</div><div id="right-count">Карти: 0</div></div>

    <div id="my-zone" class="player-zone">
        <div id="my-name">Вие</div>
        <div id="my-cards" class="cards-container"></div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    const bgMusic = document.getElementById('background');

    // Функция за пускане и спиране на фоновата музика
    function toggleMusic() {
        if (bgMusic.paused) {
            bgMusic.play().catch(err => console.log("Браузърът блокира автоматичното аудио:", err));
            document.getElementById('music-control').innerText = "⏸ Спри Музика";
        } else {
            bgMusic.pause();
            document.getElementById('music-control').innerText = "🎵 Пусни Музика";
        }
    }

    const myCustomName = prompt("Въведете вашето име за играта Трилот:") || "Играч";
    socket.emit('joinGame', myCustomName);

    // Автоматично пускане на музиката веднага щом потребителят кликне за първи път (изискване на браузърите)
    window.addEventListener('click', () => {
        if (bgMusic.paused && document.getElementById('music-control').innerText === "🎵 Пусни Музика") {
            // Оставяме бутона да я контролира, за да не стряскаме играча
        }
    }, { once: true });

    function sendBid(type) {
        socket.emit('submitBid', type);
    }

        window.lastTrickLength = state.currentTrick.length;

        if (state.playerNamesMap && state.playerNamesMap[socket.id]) {
            const myName = state.playerNamesMap[socket.id];
            document.getElementById('my-name').innerText = `Вие (${myName})`;

            let otherNames = [];
            Object.keys(state.playerNamesMap).forEach(id => {
                if (id !== socket.id && state.playerNamesMap[id]) {
                    otherNames.push(state.playerNamesMap[id]);
                }
            });
            
            if (otherNames) document.getElementById('left-name').innerText = otherNames;
            if (otherNames) document.getElementById('right-name').innerText = otherNames;
        }

        let scoreStr = "Общ резултат: ";
        if (state.playerNamesMap) {
            let activePlayersCount = 0;
            Object.keys(state.totalScores).forEach(id => {
                if (state.playerNamesMap[id]) {
                    const name = state.playerNamesMap[id];
                    scoreStr += `${name}: ${state.totalScores[id]} т. | `;
                    activePlayersCount++;
                }
            });
            
            if (activePlayersCount < 3) {
                document.getElementById('scores-text').innerText = `Чакане на играчи... (${activePlayersCount}/3 въвели име)`;
            } else {
                document.getElementById('scores-text').innerText = scoreStr;
            }
        }

        if (state.phase === 'BIDDING') {
            const currentHighest = state.highestBid.type ? `${state.highestBid.type}` : 'Няма';
            document.getElementById('game-info').innerText = `Фаза: НАДДАВАНЕ | Текущ анонс: ${currentHighest}`;
            document.getElementById('bidding-panel').style.display = (state.currentTurn === socket.id) ? 'block' : 'none';
            document.getElementById('an-indicator').innerText = "Вашите анонси: Изчисляват се...";
        } else {
            document.getElementById('game-info').innerText = `Фаза: ИГРА | Договор: ${state.gameType}`;
            document.getElementById('bidding-panel').style.display = 'none';
            document.getElementById('an-indicator').innerText = `Вашите анонси in играта: ${state.announcementText} (+${state.announcementPoints} т.)`;
        }

        if (state.playerNamesMap && state.playerNamesMap[state.currentTurn]) {
            const activeName = state.playerNamesMap[state.currentTurn];
            document.getElementById('turn-indicator').innerText = (state.currentTurn === socket.id) ? "ВАШ РЕД Е!" : `На ход е: ${activeName}`;
        }

        const myCardsDiv = document.getElementById('my-cards');
        myCardsDiv.innerHTML = '';
        state.hand.forEach((card, index) => {
            const cardEl = document.createElement('div');
            cardEl.className = `card ${(card.suit === '♦' || card.suit === '♥') ? 'red' : ''}`;
            cardEl.innerText = `${card.value}\n${card.suit}`;
            if (state.phase === 'PLAYING') {
                cardEl.onclick = () => socket.emit('playCard', index);
            }
            myCardsDiv.appendChild(cardEl);
        });

        document.getElementById('left-count').innerText = `Карти: ${state.hand.length}`;
        document.getElementById('right-count').innerText = `Карти: ${state.hand.length}`;

        const tableDiv = document.getElementById('table');
        tableDiv.innerHTML = '';
        state.currentTrick.forEach(item => {
            const cardEl = document.createElement('div');
            cardEl.className = `card ${(item.card.suit === '♦' || item.card.suit === '♥') ? 'red' : ''}`;
            cardEl.innerText = `${item.card.value}\n${item.card.suit}`;
            tableDiv.appendChild(cardEl);
        });
    });

    socket.on('errorMsg', (msg) => alert(msg));
    socket.on('roundOver', (data) => alert(data.details));
    socket.on('gameOver', (data) => alert(`Край на играта! ${data.winner} спечели мача!`));
</script>
</body>
</html>
